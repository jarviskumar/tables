<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table Generator</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

  <link rel="stylesheet" href="style.css">

  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
</head>

<body>

<nav class="navbar">
  <div class="container-fluid">
    <a class="navbar-brand text-white" href="index.html">
      <img src="multiply.svg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top text-center">
      Table Generator
    </a>
  </div>
</nav>

<div class="container mt-4">

  <div class="d-flex justify-content-center flex-column align-content-center">

      <h1 class="text-center mb-4 display-2">
        Multiplication<br>Table Generator
      </h1>

      <div class="d-flex justify-content-center align-items-center flex-column">

        <form class="col-md-6" id="formid">

          <div class="input-group mr-2 ml-2 my-2">
            <input type="number" id="inpbox" style="font-size: 1.5rem;" class="form-control text-center rounded-0 pt-2 pb-2 text-secondary focus-ring focus-ring-secondary" placeholder="Enter Number">
          </div>
        </form>

        <br>

        <div class="d-flex justify-content-center flex-wrap">
          <button class="btn btn-success rounded-0 m-2 "
            id="calcbtn" onclick="tableGenerator()">Get Table</button>

          <button class="btn btn-outline-secondary rounded-0 m-2" id="clear"
            onclick="window.location.reload()">Clear</button>
        </div>
      </div>

      <br>

      <div class="screen d-flex justify-content-center flex-column align-items-center ">
        <div class="loading" id="loading" hidden><img src="spinner.gif" alt="loading..." ></div>
        <div class="list" id="s1"></div>
        <div class="list" id="s2"></div>
        <div class="list" id="s3"></div>
        <div class="list" id="s4"></div>
        <div class="list" id="s5"></div>
        <div class="list" id="s6"></div>
        <div class="list" id="s7"></div>
        <div class="list" id="s8"></div>
        <div class="list" id="s9"></div>
        <div class="list" id="s10"></div>
        <div class="errorBox" id="errorBox"></div>
      </div>
</div>
 <div class="foot  d-flex flex-row align-items-center justify-content-center container-fluid"> <p>Made with <i class="bi bi-heart-fill text-danger"></i>  By  <a href="https://jarviskumar.github.io/linkbio" class="link link-underline fw-bold text-dark"> Dipesh </a> </p> </div>
  </div>

<!-- javascripts -->
  <script src="script.js"></script>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
